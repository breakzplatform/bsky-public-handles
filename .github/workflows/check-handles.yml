name: Check handles

on:
  schedule:
    # Every Monday at 06:23 UTC.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-handles
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits non-zero when most checks could not complete (resolver or
      # network outage), so a broken run never turns into a pull request.
      - name: Check every domain
        run: node scripts/check-handles.mjs --summary "$RUNNER_TEMP/check-summary.md"

      - name: Validate the updated data
        run: npm run validate

      - name: Regenerate the README table
        run: npm run readme

      # The pull request keeps a reviewable record of each run; it is merged
      # right away so the site (built from main) always shows the latest check.
      - name: Open the pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/handle-check
          delete-branch: true
          add-paths: |
            data/handles.json
            README.md
          commit-message: "chore(data): update handle check results"
          title: "chore(data): weekly handle check"
          body-path: ${{ runner.temp }}/check-summary.md
          labels: automated

      - name: Merge the pull request
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --rebase --delete-branch
